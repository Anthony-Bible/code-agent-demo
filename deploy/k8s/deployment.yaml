apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-agent-demo
  namespace: code-agent
  labels:
    app.kubernetes.io/name: code-agent-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-agent-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-agent-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-agent-demo
          image: ghcr.io/anthony-bible/code-agent-demo:latest  # Image tag pinned via `kustomize edit set image` at deploy time
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: code-agent-config
            - secretRef:
                name: code-agent-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: internal
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: agent-data
              mountPath: /app/.agent
            - name: alert-sources-config
              mountPath: /app/config/alert-sources.yaml
              subPath: alert-sources.yaml
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: agent-data
          emptyDir: {}
        - name: alert-sources-config
          configMap:
            name: code-agent-alert-sources
