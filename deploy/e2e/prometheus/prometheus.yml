global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: target
    static_configs:
      - targets: ["target:9100"]
        labels:
          env: e2e-test
          host: e2e-target

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
