name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a production deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit shell turns on pipefail, so a wrangler failure behind `| tee` fails the step.
    shell: bash
    working-directory: site

jobs:
  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 3

  # Forked PRs get no secrets, so they stop at the build check above.
  preview:
    name: Preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: site/dist

      - name: Deploy Preview
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # On failure the error is also JSON on stdout, so print it before failing the step.
          rc=0
          out=$(pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # Asset upload progress is printed to stdout before the JSON object.
          url=$(printf '%s\n' "$out" | sed -n '/^{/,$p' | jq -r '.preview.urls[0] // empty')
          if [ -z "$url" ]; then
            echo "::warning::Preview deployed, but it has no active URL."
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = "<!-- noalarms-preview -->";
            const body = `${marker}\n**Site preview:** ${process.env.PREVIEW_URL}\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Delete preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Find preview comment
        id: comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = "<!-- noalarms-preview -->";
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            core.setOutput("id", existing?.id ?? "");
            core.setOutput("url", existing?.body?.match(/https:\/\/\S+\.workers\.dev/)?.[0] ?? "");

      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # -y is required: without it, the prompt aborts in CI and wrangler still exits 0.
        run: pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" -y

      # A deleted Preview URL has been seen to keep serving for hours (cloudflare/developer-platform#73).
      - name: Check preview URL stopped
        if: steps.comment.outputs.url != ''
        env:
          PREVIEW_URL: ${{ steps.comment.outputs.url }}
        run: |
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$code" != "200" ]; then
              echo "Preview URL returns ${code}."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::${PREVIEW_URL} still returns 200 two minutes after the Preview was deleted."

      - name: Mark preview comment deleted
        if: steps.comment.outputs.id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          COMMENT_ID: ${{ steps.comment.outputs.id }}
        with:
          script: |
            const body = "<!-- noalarms-preview -->\n**Site preview:** deleted when this PR closed.";
            await github.rest.issues.updateComment({ ...context.repo, comment_id: Number(process.env.COMMENT_ID), body });

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://noalarms.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: site/dist

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  # PRs shoot their Preview URL and get a sticky comment that puts each shot
  # beside the latest main shot. main shoots the live site, which becomes that
  # baseline. Forked PRs have no Preview, so this job skips with them.
  # One-time setup: R2 bucket noalarms-screenshots on custom domain
  # shots.noalarms.dev, with a lifecycle rule that deletes pr/ after 30 days.
  screenshots:
    name: Screenshots
    needs: [build, preview, deploy]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.preview.result == 'success' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SHOTS_BUCKET: noalarms-screenshots
      SHOTS_HOST: https://shots.noalarms.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: site/dist

      - name: Pick target
        id: target
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            url=$PREVIEW_URL
            prefix="pr/${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}"
          else
            url=https://noalarms.dev
            prefix="main/${{ github.sha }}"
          fi
          if [ -z "$url" ]; then
            echo "::warning::No Preview URL, so no screenshots."
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

      # The edge can serve the previous build for a short time after a deploy.
      - name: Wait for this build
        id: fresh
        if: steps.target.outputs.url != ''
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          for _ in $(seq 1 12); do
            if curl -sf --max-time 10 "$URL/" | cmp -s - dist/index.html; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::${URL}/ still serves a different build after 2 minutes, so no screenshots."

      - name: Install Chromium
        if: steps.fresh.outputs.ok == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Take screenshots
        if: steps.fresh.outputs.ok == 'true'
        env:
          URL: ${{ steps.target.outputs.url }}
        run: pnpm shots "$URL" shots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        if: steps.fresh.outputs.ok == 'true'
        with:
          name: site-screenshots
          path: site/shots
          retention-days: 14

      # Keys contain the commit, so the images never change and can be cached for good.
      - name: Upload to R2
        if: steps.fresh.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          for f in shots/*.png; do
            pnpm exec wrangler r2 object put "${SHOTS_BUCKET}/${PREFIX}/$(basename "$f")" --remote \
              --file "$f" --content-type image/png --cache-control "public, max-age=31536000, immutable"
          done

      # Moves only after every image is up, so PRs never point at a half-uploaded baseline.
      - name: Point baseline at this commit
        if: steps.fresh.outputs.ok == 'true' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          printf '{"prefix":"%s"}\n' "$PREFIX" > latest.json
          pnpm exec wrangler r2 object put "${SHOTS_BUCKET}/main/latest.json" --remote \
            --file latest.json --content-type application/json --cache-control no-store

      - name: Comment screenshots
        if: steps.fresh.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const fs = require("node:fs");
            const host = process.env.SHOTS_HOST;
            const shots = JSON.parse(fs.readFileSync("site/shots/manifest.json", "utf8"));
            const pr = `${host}/${process.env.PREFIX}`;
            let main = null;
            try {
              const res = await fetch(`${host}/main/latest.json`);
              if (res.ok) main = `${host}/${(await res.json()).prefix}`;
            } catch (e) {
              core.warning(`No main screenshots to compare with: ${e.message}`);
            }
            const img = (url) => `<a href="${url}"><img src="${url}" width="360"></a>`;
            const rows = main
              ? ["| | main | this PR |", "|---|---|---|", ...shots.map((s) => `| ${s.label} | ${img(`${main}/${s.file}`)} | ${img(`${pr}/${s.file}`)} |`)]
              : ["| | this PR |", "|---|---|", ...shots.map((s) => `| ${s.label} | ${img(`${pr}/${s.file}`)} |`)];
            const marker = "<!-- noalarms-screenshots -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const intro = main ? `, beside the latest deploy from main` : ` (no main screenshots to compare with yet)`;
            const body = `${marker}\n**Site screenshots** of ${sha}${intro}. [Download the PNGs](${process.env.ARTIFACT_URL}).\n\n${rows.join("\n")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
